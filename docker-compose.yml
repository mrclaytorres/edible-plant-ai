version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: plantAI
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_NAME}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local